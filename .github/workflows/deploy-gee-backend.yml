name: Deploy GEE backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gee-backend/**"
      - ".github/workflows/deploy-gee-backend.yml"

env:
  SERVICE_NAME: cerealrisk-gee-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push container
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GOOGLE_CLOUD_PROJECT }}/cerealrisk/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud artifacts repositories describe cerealrisk --location="${{ env.REGION }}" >/dev/null 2>&1 || \
            gcloud artifacts repositories create cerealrisk --repository-format=docker --location="${{ env.REGION }}"
          gcloud builds submit gee-backend --tag "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE" \
            --project "${{ secrets.GOOGLE_CLOUD_PROJECT }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }},GEE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }},ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}" \
            --set-secrets "GEE_SERVICE_ACCOUNT_PRIVATE_KEY=GEE_SERVICE_ACCOUNT_PRIVATE_KEY:latest"

      - name: Print service URL
        run: |
          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project "${{ secrets.GOOGLE_CLOUD_PROJECT }}" \
            --region "${{ env.REGION }}" \
            --format "value(status.url)"
